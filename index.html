<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Happy Birthday Linh Giang</title>
    <meta name="description" content="A little birthday wish for Linh Giang." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="vignette"></div>
    <div class="glow"></div>

    <section class="story" id="story">
      <p class="story-kicker" id="storyKicker"></p>
      <p class="story-text" id="storyText"></p>
    </section>

    <main class="stage is-hidden" id="stage">
      <!-- <p class="eyebrow">Nguyễn Trần Linh Giang</p> -->
      <h1 class="title">Happy Birthday</h1>
      <h2 class="name" id="name"></h2>
      <p class="date-mark">29 / 10</p>
    </main>

    <p class="hint is-start" id="hint">Chạm để bắt đầu</p>
    <p class="guide" id="guide" hidden>Kéo để xoay bánh · Chạm confetti</p>

    <button class="sound" id="sound" type="button" aria-label="Bật nhạc" hidden>
      <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9v6h4l5 5V4L8 9H4zm12.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4z" />
        <path d="M19 5L5 19" />
      </svg>
      <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9v6h4l5 5V4L8 9H4zm12.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-.9 7-4.5 7-8.8s-3-7.9-7-8.8z" />
      </svg>
    </button>

    <audio id="song" src="music/music.mp3" loop preload="auto"></audio>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
