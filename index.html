<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Happy Birthday Linh Giang</title>
    <meta name="description" content="A little birthday wish for Linh Giang." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Dancing+Script:wght@500;600&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="vignette"></div>
    <div class="glow"></div>

    <section class="story" id="story">
      <p class="story-kicker" id="storyKicker"></p>
      <p class="story-text" id="storyText"></p>
    </section>

    <main class="stage is-hidden" id="stage">
      <!-- <p class="eyebrow">Nguyễn Trần Linh Giang</p> -->
      <h1 class="title">Happy Birthday</h1>
      <h2 class="name" id="name"></h2>
      <p class="date-mark">29 / 10</p>
    </main>

    <p class="hint is-start" id="hint">Chạm để bắt đầu</p>
    <p class="guide" id="guide" hidden>
      Kéo để xoay bánh · Chạm confetti<br />
      Bấm
      <span class="guide-btn" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 2.8c1.7 2.2 2.5 3.7 2.5 5.4 0 1.4-1.1 2.6-2.5 2.6S9.5 9.6 9.5 8.2c0-1.7.8-3.2 2.5-5.4z" />
          <path d="M10.2 11.4h3.6v8.1c0 .7-.5 1.2-1.2 1.2h-1.2c-.7 0-1.2-.5-1.2-1.2z" />
        </svg>
      </span>
      để đốt và thổi nến
    </p>

    <section class="letter" id="letter" hidden>
      <article class="letter-card" role="dialog" aria-labelledby="letterTitle">
        <p class="letter-hello" id="letterTitle">Gửi Giang,</p>
        <p>Anh mong điều ước của em sẽ thành sự thật.</p>
        <p>Hôm nay, mong em thật vui và hạnh phúc.</p>
        <p class="letter-sign">29 / 10</p>
        <p class="letter-hint">Chạm để gấp thư</p>
      </article>
    </section>

    <div class="dock">
      <button class="wish" id="wish" type="button" hidden aria-label="Đốt nến">
        <svg class="icon-light" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.8c1.7 2.2 2.5 3.7 2.5 5.4 0 1.4-1.1 2.6-2.5 2.6S9.5 9.6 9.5 8.2c0-1.7.8-3.2 2.5-5.4z" />
          <path d="M10.2 11.4h3.6v8.1c0 .7-.5 1.2-1.2 1.2h-1.2c-.7 0-1.2-.5-1.2-1.2z" />
        </svg>
        <svg class="icon-blow" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9.5h10.2a2.4 2.4 0 1 0-2.4-2.4" />
          <path d="M4 12.2h8" />
          <path d="M4 14.8h12.2a2.4 2.4 0 1 1-2.4 2.4" />
        </svg>
      </button>
    </div>

    <audio id="song" src="music/music.mp3" loop preload="auto"></audio>
    <audio id="birthday" src="music/happy_birthday.mp3" preload="auto"></audio>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
